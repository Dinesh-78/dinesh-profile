[project]
name = "dinesh-profile-rag"
version = "1.0.0"
description = "Production-grade RAG pipeline, Guardrails, and AI Evals for Dinesh's Career Profile"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Veerapareddy Dinesh", email = "veerapareddydinesh@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "chromadb>=0.5.20",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.4",
    "langchain-groq>=0.2.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
evals = [
    "ragas>=0.2.6",
    "datasets>=3.1.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

